spring.application.name=PolyCafe API
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
server.port=${PORT:8080}
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.cqgbiwjooadiwfdpmzru.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=15000
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET statement_timeout TO '15s'
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.servlet.multipart.enabled=false
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
spring.sql.init.mode=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
app.bootstrap.username=${BOOTSTRAP_USERNAME:}
app.bootstrap.password=${BOOTSTRAP_PASSWORD:}
app.bootstrap.full-name=${BOOTSTRAP_FULL_NAME:Chủ quán PolyCafe}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
